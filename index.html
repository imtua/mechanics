<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanics</title>
    <link rel="stylesheet" href="style.css" type="text/css">
    <link rel="stylesheet" href="homepage.css" type="text/css">
    <link rel="icon" type="image/svg+xml" href="simulation.svg" />
</head>

<body class="home-body">
    <div class="options-header">Mechanics</div>

    <div class="grid-container">
        <a class="options-card" href="pend/">
            <div class="card-thumb">
                <img src="home/photo1.png" alt="Single Pendulum">
            </div>
            <div class="card-footer">
                <span>Simple Pendulum</span>
            </div>
        </a>

        <a class="options-card" href="dpend/">
            <div class="card-thumb">
                <img src="home/photo2.png" alt="Double Pendulum">
            </div>
            <div class="card-footer">
                <span>Double Pendulum</span>
            </div>
        </a>

        <a class="options-card" href="atwood/">
            <div class="card-thumb">
                <img src="home/photo3.png" alt="Swinging Atwood Machine">
            </div>
            <div class="card-footer">
                <span>Swinging Atwood Machine</span>
            </div>
        </a>

        <a class="options-card" href="cart/">
            <div class="card-thumb">
                <img src="home/photo4.png" alt="Cart and Pendulum">
            </div>
            <div class="card-footer">
                <span>Cart and Pendulum</span>
            </div>
        </a>

        <a class="options-card" href="slope/">
            <div class="card-thumb">
                <img src="home/photo5.png" alt="Disk on Slope">
            </div>
            <div class="card-footer">
                <span>Disk on Slope</span>
            </div>
        </a>

        <a class="options-card" href="disk/">
            <div class="card-thumb">
                <img src="home/photo6.png" alt="Rolling Disk Pendulum">
            </div>
            <div class="card-footer">

            </div>

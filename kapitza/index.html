<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js"></script>
    <link rel="stylesheet" href="../style.css?v=mobile">
    <link rel="icon" type="image/svg+xml" href="../simulation.svg" />
</head>

<body>
    <script src="../mechsimulator.js"></script>
    <script>
        mechasimulator.title = "Kapitza Pendulum";
        mechasimulator.symbols.names = ["theta", "l", "a", "omega"];
        mechasimulator.symbols.latex = ["\\theta", "l", "a", "\\omega"];
        mechasimulator.metricLabels = ["θ"];
        mechasimulator.metricVelocityLabels = ["dθ/dt"];
        mechasimulator.parameterSummary = function (constants) {
            return `Length: ${constants.l.toFixed(2)} m | Amplitude: ${
                constants.a.toFixed(2)
            } m | Frequency: ${constants.omega.toFixed(1)} rad/s`;
        };

        function drawSystem(params, time, constants) {
            const theta = params[0];
            const scale = 150;
            const pivotY = constants.a * Math.cos(constants.omega * time) * scale;
            const bobX = Math.sin(theta) * constants.l * scale;
            const bobY = -Math.cos(theta) * constants.l * scale;

            resetCanvas();
            ctx.translate(0, -20);
            ctx.setLineDash([]);
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#000";
            ctx.save();
            ctx.strokeStyle = "#888";
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(-55, -constants.a * scale);
            ctx.lineTo(-55, constants.a * scale);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = "#555";
            ctx.font = "14px ui-monospace, monospace";
            ctx.textAlign = "left";
            ctx.fillText("pivot vibration", -45, -constants.a * scale - 8);
            ctx.restore();
            ctx.beginPath();
            ctx.moveTo(-35, 0);
            ctx.lineTo(35, 0);
            ctx.stroke();
            ctx.translate(0, pivotY);
            drawHinge();
            ctx.save();
            ctx.rotate(theta - Math.PI);
            drawBar(constants.l * scale);
            ctx.restore();
            ctx.translate(bobX, bobY);
            drawTrailPoint();
            drawMass();
            moveLabel("m", 20, 0);
        }
    </script>
</body>

</html>
